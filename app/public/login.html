<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fogo Branco</title>
  <link rel="stylesheet" href="style.css?v=11">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fogo Branco">
  <meta name="mobile-web-app-capable" content="yes">
</head>
<body>

<div class="auth-container">
  <div class="auth-box">
    <div class="logo"><img src="icon-192.png" alt="Fogo Branco" class="login-logo"></div>
    <h1>Fogo Branco</h1>
    <p>Sistema de Combate a Incêndios Florestais</p>

    <div class="error-msg" id="error-msg" style="display:none;"></div>

    <!-- TELA 1: Escolha de perfil -->
    <div id="tela-perfil">
      <button class="btn-perfil btn-combatente" onclick="entrarCombatente()">
        <span class="perfil-icon">⛑️</span>
        <span class="perfil-label">Combatente</span>
        <span class="perfil-sub">Registrar e Mapa</span>
      </button>
      <button class="btn-perfil btn-gestor" onclick="mostrarEquipes()">
        <span class="perfil-icon">📋</span>
        <span class="perfil-label">Gestor</span>
        <span class="perfil-sub">Acesso completo</span>
      </button>
    </div>

    <!-- TELA 2: Escolha da equipe (gestor) -->
    <div id="tela-equipes" style="display:none;">
      <p style="font-size:13px; color:#666; margin-bottom:16px;">Selecione sua equipe:</p>
      <div class="equipes-grid">
        <button class="btn-equipe" onclick="selecionarEquipe('Defesa Civil')">Defesa Civil</button>
        <button class="btn-equipe" onclick="selecionarEquipe('IEF')">IEF</button>
        <button class="btn-equipe" onclick="selecionarEquipe('Carcará')">Carcará</button>
        <button class="btn-equipe" onclick="selecionarEquipe('AMDA Gerdau')">AMDA Gerdau</button>
        <button class="btn-equipe" onclick="selecionarEquipe('AMDA IEF')">AMDA IEF</button>
        <button class="btn-equipe" onclick="selecionarEquipe('CBMMG')">CBMMG</button>
      </div>
      <button class="btn btn-secondary" style="margin-top:14px; width:100%; font-size:13px;" onclick="voltarPerfil()">← Voltar</button>
    </div>

    <!-- TELA 3: Senha da equipe -->
    <div id="tela-senha" style="display:none;">
      <p style="font-size:14px; color:#333; margin-bottom:6px; font-weight:600;" id="equipe-selecionada-label"></p>
      <p style="font-size:13px; color:#666; margin-bottom:16px;">Digite a senha de acesso:</p>
      <div class="form-group">
        <input type="password" id="senha-gestor" placeholder="Senha" autocomplete="current-password"
               onkeydown="if(event.key==='Enter') entrarGestor()">
      </div>
      <button class="btn btn-primary" onclick="entrarGestor()" style="margin-bottom:10px;">Entrar como Gestor</button>
      <button class="btn btn-secondary" style="width:100%; font-size:13px;" onclick="voltarEquipes()">← Voltar</button>
    </div>

  </div>
</div>

<script>
  // ──────────────────────────────────────────────────────────────────────
  // NÃO faz auto-redirect – a tela de perfil é sempre a primeira tela
  // ──────────────────────────────────────────────────────────────────────

  let equipeSelecionada = "";

  // ── Service Worker: regista (cacheia o app inteiro para uso offline) ──
  // O navegador cuida de sugerir a instalação/atalho automaticamente.
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js").catch(() => {});
  }

  // ── Navegação de telas ─────────────────────────────────────────────────
  function mostrarEquipes() {
    document.getElementById("tela-perfil").style.display = "none";
    document.getElementById("tela-equipes").style.display = "block";
    document.getElementById("error-msg").style.display = "none";
  }
  function voltarPerfil() {
    document.getElementById("tela-equipes").style.display = "none";
    document.getElementById("tela-perfil").style.display = "block";
    document.getElementById("error-msg").style.display = "none";
  }
  function selecionarEquipe(equipe) {
    equipeSelecionada = equipe;
    document.getElementById("equipe-selecionada-label").textContent = "Equipe: " + equipe;
    document.getElementById("tela-equipes").style.display = "none";
    document.getElementById("tela-senha").style.display = "block";
    document.getElementById("senha-gestor").value = "";
    document.getElementById("error-msg").style.display = "none";
    setTimeout(() => document.getElementById("senha-gestor").focus(), 100);
  }
  function voltarEquipes() {
    document.getElementById("tela-senha").style.display = "none";
    document.getElementById("tela-equipes").style.display = "block";
    document.getElementById("error-msg").style.display = "none";
  }

  // ══════════════════════════════════════════════════════════════════════
  // AUTENTICAÇÃO OFFLINE — funciona sem service worker, apenas localStorage
  // Chaves de backup: fb_tok_combatente | fb_tok_gestor_<equipe>
  // ══════════════════════════════════════════════════════════════════════

  function salvarTokenOffline(role, equipe, token) {
    if (role === "combatente") localStorage.setItem("fb_tok_combatente", token);
    else localStorage.setItem("fb_tok_gestor_" + equipe, token);
  }

  function tokenOffline(role, equipe) {
    if (role === "combatente") return localStorage.getItem("fb_tok_combatente");
    return localStorage.getItem("fb_tok_gestor_" + equipe);
  }

  function entrarComToken(token, role, team) {
    localStorage.setItem("token", token);
    localStorage.setItem("role", role);
    localStorage.setItem("team", team);
    window.location.href = "/";
  }

  // ══════════════════════════════════════════════════════════════════════
  // TOKEN LOCAL — gerado 100% no navegador, sem depender do servidor.
  // Formato: base64(payload) + ".local" — o servidor decodifica e confia
  // nele localmente (ver função auth() em server.js). Funciona offline,
  // em app instalado, ou em hospedagem estática (Cloudflare Pages).
  // ══════════════════════════════════════════════════════════════════════
  function gerarTokenLocal(payload) {
    const json = JSON.stringify(payload);
    const b64 = btoa(unescape(encodeURIComponent(json)));
    return b64 + ".local";
  }

  const SENHA_GESTOR_LOCAL = "106106";
  const EQUIPES_VALIDAS_LOCAL = ["Defesa Civil", "IEF", "Carcará", "AMDA Gerdau", "AMDA IEF", "CBMMG"];

  // ── Entrar como Combatente ─────────────────────────────────────────────
  // Gera o token localmente na hora — nunca falha, com ou sem internet.
  function entrarCombatente() {
    const errorEl = document.getElementById("error-msg");
    errorEl.style.display = "none";

    const token = gerarTokenLocal({ role: "combatente", team: "Combatente" });
    salvarTokenOffline("combatente", "", token);
    entrarComToken(token, "combatente", "Combatente");

    // Tenta obter um token "oficial" do servidor em segundo plano (best-effort)
    fetch("/auth/combatente", { method: "POST", headers: { "Content-Type": "application/json" } })
      .then(r => r.json())
      .then(d => { if (d.token) salvarTokenOffline("combatente", "", d.token); })
      .catch(() => {});
  }

  // ── Entrar como Gestor ─────────────────────────────────────────────────
  // Valida a senha localmente e gera o token na hora — funciona offline.
  function entrarGestor() {
    const senha   = document.getElementById("senha-gestor").value;
    const errorEl = document.getElementById("error-msg");
    errorEl.style.display = "none";
    if (!senha) { errorEl.textContent = "Digite a senha."; errorEl.style.display = "block"; return; }

    if (senha !== SENHA_GESTOR_LOCAL) {
      errorEl.textContent = "Senha incorreta";
      errorEl.style.display = "block";
      return;
    }
    if (!EQUIPES_VALIDAS_LOCAL.includes(equipeSelecionada)) {
      errorEl.textContent = "Equipe inválida";
      errorEl.style.display = "block";
      return;
    }

    const token = gerarTokenLocal({ role: "gestor", team: equipeSelecionada, senha });
    salvarTokenOffline("gestor", equipeSelecionada, token);
    entrarComToken(token, "gestor", equipeSelecionada);

    // Tenta obter um token "oficial" do servidor em segundo plano (best-effort)
    fetch("/auth/gestor", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ equipe: equipeSelecionada, senha })
    })
      .then(r => r.json())
      .then(d => { if (d.token) salvarTokenOffline("gestor", equipeSelecionada, d.token); })
      .catch(() => {});
  }
</script>
</body>
</html>
