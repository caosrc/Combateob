<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fogo Branco</title>
  <link rel="stylesheet" href="style.css?v=10">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fogo Branco">
  <meta name="mobile-web-app-capable" content="yes">
</head>
<body>

<!-- BARRA DE PROGRESSO MAPA OFFLINE -->
<div id="tiles-progress-banner" style="display:none; background:#1a3a5c; color:#fff; font-size:12px; padding:8px 16px; align-items:center; gap:10px;">
  <span>📥</span>
  <div style="flex:1;">
    <div id="tiles-progress-text">Instalando mapa offline (40 km de Ouro Branco)…</div>
    <div style="background:rgba(255,255,255,0.25); border-radius:4px; height:6px; margin-top:4px; overflow:hidden;">
      <div id="tiles-progress-bar" style="background:#4fc3f7; height:100%; width:0%; transition:width 0.4s;"></div>
    </div>
  </div>
  <span id="tiles-progress-pct" style="font-weight:700; min-width:40px; text-align:right;">0%</span>
</div>

<div class="auth-container">
  <div class="auth-box">
    <div class="logo"><img src="icon-192.png" alt="Fogo Branco" class="login-logo"></div>
    <h1>Fogo Branco</h1>
    <p>Sistema de Combate a Incêndios Florestais</p>

    <div class="error-msg" id="error-msg"></div>

    <!-- TELA 1: Escolha de perfil -->
    <div id="tela-perfil">
      <button class="btn-perfil btn-combatente" onclick="entrarCombatente()">
        <span class="perfil-icon">⛑️</span>
        <span class="perfil-label">Combatente</span>
        <span class="perfil-sub">Registrar e Mapa</span>
      </button>
      <button class="btn-perfil btn-gestor" onclick="mostrarEquipes()">
        <span class="perfil-icon">📋</span>
        <span class="perfil-label">Gestor</span>
        <span class="perfil-sub">Acesso completo</span>
      </button>
    </div>

    <!-- TELA 2: Escolha da equipe (gestor) -->
    <div id="tela-equipes" style="display:none;">
      <p style="font-size:13px; color:#666; margin-bottom:16px;">Selecione sua equipe:</p>
      <div class="equipes-grid">
        <button class="btn-equipe" onclick="selecionarEquipe('Defesa Civil')">Defesa Civil</button>
        <button class="btn-equipe" onclick="selecionarEquipe('IEF')">IEF</button>
        <button class="btn-equipe" onclick="selecionarEquipe('Carcará')">Carcará</button>
        <button class="btn-equipe" onclick="selecionarEquipe('AMDA Gerdau')">AMDA Gerdau</button>
        <button class="btn-equipe" onclick="selecionarEquipe('AMDA IEF')">AMDA IEF</button>
        <button class="btn-equipe" onclick="selecionarEquipe('CBMMG')">CBMMG</button>
      </div>
      <button class="btn btn-secondary" style="margin-top:14px; width:100%; font-size:13px;" onclick="voltarPerfil()">← Voltar</button>
    </div>

    <!-- TELA 3: Senha da equipe -->
    <div id="tela-senha" style="display:none;">
      <p style="font-size:14px; color:#333; margin-bottom:6px; font-weight:600;" id="equipe-selecionada-label"></p>
      <p style="font-size:13px; color:#666; margin-bottom:16px;">Digite a senha de acesso:</p>
      <div class="form-group">
        <input type="password" id="senha-gestor" placeholder="Senha" autocomplete="current-password" onkeydown="if(event.key==='Enter') entrarGestor()">
      </div>
      <button class="btn btn-primary" onclick="entrarGestor()" style="margin-bottom:10px;">Entrar como Gestor</button>
      <button class="btn btn-secondary" style="width:100%; font-size:13px;" onclick="voltarEquipes()">← Voltar</button>
    </div>

  </div>
</div>

<script>
  if (localStorage.getItem("role")) {
    window.location.href = "/";
  }

  let equipeSelecionada = "";

  function mostrarEquipes() {
    document.getElementById("tela-perfil").style.display = "none";
    document.getElementById("tela-equipes").style.display = "block";
    document.getElementById("error-msg").style.display = "none";
  }

  function voltarPerfil() {
    document.getElementById("tela-equipes").style.display = "none";
    document.getElementById("tela-perfil").style.display = "block";
    document.getElementById("error-msg").style.display = "none";
  }

  function selecionarEquipe(equipe) {
    equipeSelecionada = equipe;
    document.getElementById("equipe-selecionada-label").textContent = "Equipe: " + equipe;
    document.getElementById("tela-equipes").style.display = "none";
    document.getElementById("tela-senha").style.display = "block";
    document.getElementById("senha-gestor").value = "";
    document.getElementById("error-msg").style.display = "none";
    setTimeout(() => document.getElementById("senha-gestor").focus(), 100);
  }

  function voltarEquipes() {
    document.getElementById("tela-senha").style.display = "none";
    document.getElementById("tela-equipes").style.display = "block";
    document.getElementById("error-msg").style.display = "none";
  }

  async function entrarCombatente() {
    // Se já tem token válido (ex: sessão offline anterior), usa direto
    const tokenExistente = localStorage.getItem("token");
    const roleExistente  = localStorage.getItem("role");
    if (tokenExistente && roleExistente === "combatente") {
      window.location.href = "/";
      return;
    }

    if (!navigator.onLine) {
      const errorEl = document.getElementById("error-msg");
      errorEl.textContent = "📴 Sem conexão. Faça login online pelo menos uma vez para usar offline.";
      errorEl.style.display = "block";
      return;
    }

    try {
      const r = await fetch("/auth/combatente", { method: "POST", headers: { "Content-Type": "application/json" } });
      const data = await r.json();
      if (!data.token) { alert("Erro ao autenticar. Tente novamente."); return; }
      localStorage.setItem("token", data.token);
      localStorage.setItem("role", "combatente");
      localStorage.setItem("team", "Combatente");
      window.location.href = "/";
    } catch (e) {
      alert("Sem conexão com o servidor. Verifique sua internet e tente novamente.");
    }
  }

  // Regista o service worker e ouve progresso de instalação do mapa offline
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js").then(reg => {
      // Se já existe um SW activo, dispara pré-cache agora
    }).catch(() => {});

    navigator.serviceWorker.addEventListener("message", e => {
      const { type, downloaded, total } = e.data || {};
      const banner = document.getElementById("tiles-progress-banner");
      const bar    = document.getElementById("tiles-progress-bar");
      const pct    = document.getElementById("tiles-progress-pct");
      const txt    = document.getElementById("tiles-progress-text");

      if (type === "TILES_PROGRESS" && banner) {
        banner.style.display = "flex";
        const p = total > 0 ? Math.round((downloaded / total) * 100) : 0;
        if (bar) bar.style.width = p + "%";
        if (pct) pct.textContent = p + "%";
        if (txt) txt.textContent = `Instalando mapa offline… ${downloaded} / ${total} tiles`;
      }
      if (type === "TILES_CACHED" && banner) {
        if (bar) bar.style.width = "100%";
        if (pct) pct.textContent = "100%";
        if (txt) txt.textContent = "✅ Mapa offline pronto – pode usar sem internet!";
        setTimeout(() => { banner.style.display = "none"; }, 4000);
      }
    });
  }

  async function entrarGestor() {
    const senha = document.getElementById("senha-gestor").value;
    const errorEl = document.getElementById("error-msg");
    errorEl.style.display = "none";
    if (!senha) { errorEl.textContent = "Digite a senha."; errorEl.style.display = "block"; return; }

    try {
      const r = await fetch("/auth/gestor", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ equipe: equipeSelecionada, senha })
      });
      const data = await r.json();
      if (data.error) { errorEl.textContent = data.error; errorEl.style.display = "block"; return; }
      localStorage.setItem("token", data.token);
      localStorage.setItem("role", "gestor");
      localStorage.setItem("team", equipeSelecionada);
      window.location.href = "/";
    } catch (e) {
      errorEl.textContent = "Sem conexão com o servidor.";
      errorEl.style.display = "block";
    }
  }
</script>
</body>
</html>
